<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Stream</title>
</head>
<body>
    <!-- Check if 'streams' exists in context -->
    {% if streams|length == 1 %}
        <!-- Single stream display -->
        <center><h1>Live Stream</h1></center>
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <div class="card mb-4">
                        <img src="{{ streams.0.url }}" alt="Stream" class="card-img-top" style="height:35rem; width:auto;">
                        <div class="card-body">
                            <h5 class="card-title">{{ streams.0.location }}</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    {% elif streams|length > 1 %}
        <!-- Multiple streams grid -->
        <center><h1>Live Streams</h1></center>
        <div class="container">
            <div class="row">
                {% for stream in streams %}
                    <div class="col-md-6">
                        <div class="card mb-4">
                            <img src="{{ stream.url }}" alt="Stream" class="card-img-top" style="height:20rem; object-fit: cover;">
                            <div class="card-body">
                                <h5 class="card-title">{{ stream.location }}</h5>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    {% else %}
        <p>No streams available.</p>
    {% endif %}
</body>
</html>
